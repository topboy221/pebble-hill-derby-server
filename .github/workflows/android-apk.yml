# Builds the Soapcube Racing Android test app (an APK you install on your phone).
# Runs by itself whenever the game, the app or the ads plugin changes, or by hand: Actions → "Android test app" → Run workflow.
# The APK is under the finished run → Artifacts → soapcube-racing-apk (a zip with app-debug.apk inside).
name: Android test app

on:
  workflow_dispatch:
  push:
    paths:
      - 'public/pebble-hill-derby.html'
      - 'app/**'
      - 'capacitor-yodo1-mas/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Capacitor and the ads plugin
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Put the game into the app
        working-directory: app
        run: npm run sync

      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: soapcube-racing-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
