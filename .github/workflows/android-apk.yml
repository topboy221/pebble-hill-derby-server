# Builds the Soapcube Racing Android test app (an APK you install on your phone).
# This file must be in the repository's top folder, at .github/workflows/ (GitHub ignores it anywhere else).
# Runs only when you start it: Actions → "Android test app" → Run workflow.
# The APK is under the finished run → Artifacts → soapcube-racing-apk (a zip with app-debug.apk inside).
name: Android test app

on:
  workflow_dispatch:   # only when you start it: Actions → Android test app → Run workflow

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # the project can be the repository itself, or a phd-server folder inside it
      - name: Find the project folder
        run: |
          if [ -f app/package.json ]; then echo "ROOT=." >> "$GITHUB_ENV"
          elif [ -f phd-server/app/package.json ]; then echo "ROOT=phd-server" >> "$GITHUB_ENV"
          else
            echo "::error::Can't find app/package.json. Upload the app and capacitor-yodo1-mas folders next to server.js."
            ls -la; exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Capacitor and the ads plugin
        working-directory: ${{ env.ROOT }}/app
        run: npm install --no-audit --no-fund

      # the game file: phd-server/public/pebble-hill-derby.html, or wherever it is in the repository
      - name: Put the game into the app
        working-directory: ${{ env.ROOT }}/app
        run: |
          GAME=""
          for f in ../public/pebble-hill-derby.html ../public/index.html; do [ -f "$f" ] && { GAME="$f"; break; }; done
          if [ -z "$GAME" ]; then GAME=$(cd "$GITHUB_WORKSPACE" && find . -name 'pebble-hill-derby.html' -not -path '*/node_modules/*' -not -path '*/app/*' | head -n 1); [ -n "$GAME" ] && GAME="$GITHUB_WORKSPACE/$GAME"; fi
          if [ -z "$GAME" ]; then echo "::error::Can't find pebble-hill-derby.html anywhere in the repository."; exit 1; fi
          echo "Game file: $GAME ($(wc -c < "$GAME") bytes)"
          mkdir -p www
          # the game file is a page body: give it the same document head the game server adds
          # (UTF-8 text, so characters like – and · show right; phone screen width; full screen)
          node -e '
            const fs=require("fs");let h=fs.readFileSync(process.argv[1],"utf8");
            if(!/^\s*<!doctype/i.test(h))h="<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\"><meta name=\"theme-color\" content=\"#8ec2e6\"></head><body>"+h+"</body></html>";
            fs.writeFileSync("www/index.html",h);' "$GAME"
          head -c 200 www/index.html; echo
          npx cap sync android

      - name: Build the APK
        working-directory: ${{ env.ROOT }}/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: soapcube-racing-apk
          path: ${{ env.ROOT }}/app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
