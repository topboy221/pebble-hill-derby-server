# Builds the Soapcube Racing Android app. Two kinds of build (you pick when you start it):
#  - "Test APK": an APK to install straight on your phone (artifact soapcube-racing-apk, with app-debug.apk inside).
#  - "Google Play": an AAB to upload to Play Console (artifact soapcube-racing-play, with app-release.aab inside),
#    signed with your upload key from the repository's secrets UPLOAD_KEYSTORE_B64 and UPLOAD_KEYSTORE_PASSWORD (README step 10).
# This file must be in the repository's top folder, at .github/workflows/ (GitHub ignores it anywhere else).
# Runs only when you start it: Actions → "Android test app" → Run workflow.
name: Android test app

on:
  workflow_dispatch:   # only when you start it: Actions → Android test app → Run workflow
    inputs:
      build:
        description: 'What to build'
        type: choice
        default: 'Test APK (install on your phone)'
        options:
          - 'Test APK (install on your phone)'
          - 'Google Play (AAB to upload)'

env:
  APP_BUILD: ${{ github.run_number }}   # the app's build number: goes up by one every run
  PLAY: ${{ startsWith(github.event.inputs.build, 'Google Play') }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # the project can be the repository itself, or a phd-server folder inside it
      - name: Find the project folder
        run: |
          if [ -f app/package.json ]; then echo "ROOT=." >> "$GITHUB_ENV"
          elif [ -f phd-server/app/package.json ]; then echo "ROOT=phd-server" >> "$GITHUB_ENV"
          else
            echo "::error::Can't find app/package.json. Upload the app and capacitor-yodo1-mas folders next to server.js."
            ls -la; exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Capacitor, the ads plugin and RevenueCat
        working-directory: ${{ env.ROOT }}/app
        run: npm install --no-audit --no-fund

      # the game file: phd-server/public/pebble-hill-derby.html, or wherever it is in the repository
      - name: Put the game into the app
        working-directory: ${{ env.ROOT }}/app
        run: |
          GAME=""
          for f in ../public/pebble-hill-derby.html ../public/index.html; do [ -f "$f" ] && { GAME="$f"; break; }; done
          if [ -z "$GAME" ]; then GAME=$(cd "$GITHUB_WORKSPACE" && find . -name 'pebble-hill-derby.html' -not -path '*/node_modules/*' -not -path '*/app/*' | head -n 1); [ -n "$GAME" ] && GAME="$GITHUB_WORKSPACE/$GAME"; fi
          if [ -z "$GAME" ]; then echo "::error::Can't find pebble-hill-derby.html anywhere in the repository."; exit 1; fi
          echo "Game file: $GAME ($(wc -c < "$GAME") bytes)"
          mkdir -p www
          # the game file is a page body: give it the same document head the game server adds
          # (UTF-8 text, so characters like – and · show right; phone screen width; full screen)
          node -e '
            const fs=require("fs");let h=fs.readFileSync(process.argv[1],"utf8");
            if(!/^\s*<!doctype/i.test(h))h="<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\"><meta name=\"theme-color\" content=\"#8ec2e6\"></head><body>"+h+"</body></html>";
            fs.writeFileSync("www/index.html",h);' "$GAME"
          # the How to play clips sit next to the game (public/howto)
          rm -rf www/howto; if [ -d "$(dirname "$GAME")/howto" ]; then cp -r "$(dirname "$GAME")/howto" www/howto; echo "How to play clips: $(ls www/howto | tr '\n' ' ')"; else echo "::warning::No howto folder next to the game: How to play will have no clips."; fi
          # the music sits next to the game too (public/music)
          rm -rf www/music; if [ -d "$(dirname "$GAME")/music" ]; then cp -r "$(dirname "$GAME")/music" www/music; echo "Music: $(ls www/music | tr '\n' ' ')"; else echo "::warning::No music folder next to the game: the game will have no music."; fi
          head -c 200 www/index.html; echo
          npx cap sync android

      - name: Build the test APK
        if: env.PLAY != 'true'
        working-directory: ${{ env.ROOT }}/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v6
        if: env.PLAY != 'true'
        with:
          name: soapcube-racing-apk
          path: ${{ env.ROOT }}/app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build for Google Play (signed with your upload key)
        if: env.PLAY == 'true'
        working-directory: ${{ env.ROOT }}/app/android
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          # the upload key: from the secret UPLOAD_KEYSTORE_B64, or else from the locked copy in the repository
          # (app/android/upload-key.jks.enc, encrypted with the password: useless without the UPLOAD_KEYSTORE_PASSWORD secret)
          export UPLOAD_KEYSTORE_PASSWORD="$(printf '%s' "$UPLOAD_KEYSTORE_PASSWORD" | tr -d ' \r\n')"   # (a stray space or line break from pasting doesn't count)
          echo "UPLOAD_KEYSTORE_PASSWORD: ${#UPLOAD_KEYSTORE_PASSWORD} characters (should be 24)"
          if [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::error::GitHub doesn't pass the secret UPLOAD_KEYSTORE_PASSWORD to the build. Add it under Settings → Secrets and variables → Actions → Repository secrets, with exactly that name."; exit 1; fi
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "Upload key: from the secret UPLOAD_KEYSTORE_B64 (${#UPLOAD_KEYSTORE_B64} characters)"
            echo "$UPLOAD_KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"
          elif [ -f upload-key.jks.enc ]; then
            echo "Upload key: from upload-key.jks.enc in the repository"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in upload-key.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:UPLOAD_KEYSTORE_PASSWORD \
              || { echo "::error::Couldn't unlock upload-key.jks.enc: the UPLOAD_KEYSTORE_PASSWORD secret doesn't match it."; exit 1; }
          else
            echo "::error::No upload key: put upload-key.jks.enc in phd-server/app/android/ (README step 10)."; exit 1
          fi
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/upload.jks"
          echo "Build number (versionCode): $APP_BUILD"

      - uses: actions/upload-artifact@v6
        if: env.PLAY == 'true'
        with:
          name: soapcube-racing-play
          path: ${{ env.ROOT }}/app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
